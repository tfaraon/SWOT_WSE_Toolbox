[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swot-wse-toolbox"
version = "0.3.2"
description = "Local lake water-level time series from SWOT Raster observations"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Thomas Faraon"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "netCDF4>=1.6", "pyproj>=3.5", "rasterio>=1.3", "tqdm>=4.64"]

[project.optional-dependencies]
vector = ["pyogrio>=0.8", "geopandas>=0.14"]
download = ["earthaccess>=0.10"]
figures = ["matplotlib>=3.8"]
notebook = ["jupyter", "matplotlib", "geopandas", "shapely", "contextily", "folium", "plotly"]

[project.scripts]
swot-stations = "SWOT_toolbox.run:main"

[tool.setuptools]
packages = ["SWOT_toolbox"]
